name: mutation

# The mutation tier (tests/mutation) runs only when source or tests change.
on:
  push:
    branches: [main]
    paths: ["src/mdgan/**", "tests/**", "pyproject.toml"]
  pull_request:
    paths: ["src/mdgan/**", "tests/**", "pyproject.toml"]
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,data]"
      - run: python -m pytest -m mutation tests/mutation -q